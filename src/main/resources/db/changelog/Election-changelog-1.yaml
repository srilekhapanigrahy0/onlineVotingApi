databaseChangeLog:
  - changeSet:
      id: create-election-table
      author: srilekha
      changes:
        - createTable:
            tableName: election
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: company_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: details
                  type: TEXT
              - column:
                  name: created_by
                  type: VARCHAR(100)
              - column:
                  name: created_date
                  type: DATETIME
              - column:
                  name: status
                  type: VARCHAR(50)
              - column:
                  name: approved_by
                  type: VARCHAR(100)
              - column:
                  name: approved_date
                  type: DATETIME
              - column:
                  name: comment
                  type: TEXT
              - column:
                  name: last_update_date
                  type: DATETIME