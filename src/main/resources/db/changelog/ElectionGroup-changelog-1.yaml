databaseChangeLog:
  - changeSet:
      id: 001-create-election-group-table
      author: srilekha
      changes:
        - createTable:
            tableName: election_group
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: election_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: details
                  type: TEXT
              - column:
                  name: created_by
                  type: VARCHAR(100)
              - column:
                  name: created_date
                  type: TIMESTAMP
              - column:
                  name: status
                  type: VARCHAR(50)
              - column:
                  name: approved_by
                  type: VARCHAR(100)
              - column:
                  name: approved_date
                  type: TIMESTAMP
              - column:
                  name: comment
                  type: TEXT
              - column:
                  name: updated_by
                  type: VARCHAR(100)
              - column:
                  name: last_update_date
                  type: TIMESTAMP